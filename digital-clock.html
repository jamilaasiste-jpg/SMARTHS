<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Digital Clock</title>\n    <script>\n        function updateClock() {\n            const options = {\n                timeZone: 'UTC',\n                hour: '2-digit',\n                minute: '2-digit',\n                second: '2-digit',\n                hour12: false\n            };\n            const utcTime = new Date().toLocaleString('en-US', options);\n            document.getElementById('utc').innerText = `UTC: ${utcTime}`;\n\n            options.timeZone = 'America/New_York';\n            const nyTime = new Date().toLocaleString('en-US', options);\n            document.getElementById('ny').innerText = `New York: ${nyTime}`;\n\n            options.timeZone = 'Europe/London';\n            const londonTime = new Date().toLocaleString('en-US', options);\n            document.getElementById('london').innerText = `London: ${londonTime}`;\n\n            options.timeZone = 'Asia/Tokyo';\n            const tokyoTime = new Date().toLocaleString('en-US', options);\n            document.getElementById('tokyo').innerText = `Tokyo: ${tokyoTime}`;\n        }\n        setInterval(updateClock, 1000);\n    </script>\n</head>\n<body onload="updateClock()">\n    <h1>Digital Clock</h1>\n    <div id="utc"></div>\n    <div id="ny"></div>\n    <div id="london"></div>\n    <div id="tokyo"></div>\n</body>\n</html>
